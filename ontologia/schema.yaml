reglas:
  - Los IDs son consecutivos y nunca se reutilizan; nada se borra (se marca estado/anulado).
  - Montos en pesos colombianos, formato $50.000.
  - Toda instancia generada desde finca.db lleva generado_por: tools/sync_finca.py.
