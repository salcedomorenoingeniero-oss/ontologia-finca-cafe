# Ontología MarcaEjemplo (estilo Palantir: object types, properties, link types, actions)
version: 1
actualizado: 2026-11-02
fuente_datos: finca.db (en el PC: copia de finca.db en raw/finca-datos)
object_types:
  - nombre: "Finca"
    tabla_db: null
    propiedades: [nombre, municipio, propietario, administrador, altitud, hectareas_totales]
    acciones: [registrar_lote]
  - nombre: "Lote"
    tabla_db: lote
    propiedades: [id, nombre, numero, hectareas, variedad, arboles, notas, poligono_gps]
    acciones: [crear_lote, actualizar_lote]
  - nombre: "Persona"
    tabla_db: persona
    propiedades: [id, nombre, rol, telefono, activo]
    acciones: [crear_persona]
  - nombre: "Actividad-Evento"
    tabla_db: actividad
    propiedades: [id, fecha, labor, jornales, valor_jornal, costo_cop, evento, ref]
    acciones: [registrar_jornal, agrupar_evento]
  - nombre: "Siembra"
    tabla_db: siembra
    propiedades: [fecha, tipo, variedad, dist_planta_m, dist_surco_m, plantas, fecha_renovacion]
    acciones: [registrar_siembra]
  - nombre: "Floración"
    tabla_db: floracion
    propiedades: [fecha, calificacion, control_roya, control_broca, cosecha_estimada]
    acciones: [registrar_floracion]
  - nombre: "Insumo"
    tabla_db: null
    propiedades: [nombre, tipo (fertilizante, fungicida, insecticida, herbicida, biológico, colino), ingrediente_activo, grado]
    acciones: [crear_insumo]
  - nombre: "Compra"
    tabla_db: compra
    propiedades: [fecha, insumo, proveedor, cantidad, unidad, total_cop]
    acciones: [registrar_compra]
  - nombre: "Pago"
    tabla_db: pago
    propiedades: [fecha, concepto (kg/jornal/otro), cantidad, tarifa_cop, total_cop]
    acciones: [registrar_pago]
  - nombre: "Deuda"
    tabla_db: deuda
    propiedades: [fecha, acreedor, concepto, monto_cop, interes_pct, saldo_cop, estado]
    acciones: [abonar_deuda]
  - nombre: "Recolección"
    tabla_db: recoleccion
    propiedades: [fecha, kg_cereza, fuente]
    acciones: [registrar_recoleccion]
  - nombre: "Beneficio"
    tabla_db: beneficio
    propiedades: [fecha_inicio, fecha_fin, kg_cereza, kg_pergamino_seco, humedad, proceso]
    acciones: [registrar_beneficio]
  - nombre: "Lote de café-Microlote"
    tabla_db: null
    propiedades: [codigo, kg_pergamino, proceso, puntaje_taza, notas_cata, estado]
    acciones: [crear_microlote, registrar_cata]
  - nombre: "Venta"
    tabla_db: venta
    propiedades: [fecha, comprador, producto, kg, precio_kg_cop, total_cop, factor_rendimiento]
    acciones: [registrar_venta]
  - nombre: "Comprador"
    tabla_db: null
    propiedades: [nombre, tipo (FNC, cooperativa, exportador, importador, tostador), país, contacto, requisitos]
    acciones: [registrar_comprador]
  - nombre: "Mercado"
    tabla_db: null
    propiedades: [nombre, país/región, regulación, precio_referencia]
    acciones: [—]
  - nombre: "Certificación"
    tabla_db: null
    propiedades: [nombre, entidad, vigencia, requisitos, costo]
    acciones: [—]
  - nombre: "Contenido-Publicación"
    tabla_db: null
    propiedades: [fecha, canal (LinkedIn), idioma, formato, tema, estado (borrador/aprobado/publicado), metricas]
    acciones: [crear_borrador, aprobar (sólo Administrador), registrar_metricas]
  - nombre: "Indicador"
    tabla_db: null
    propiedades: [nombre, formula, valor, fecha_calculo, fuente_datos]
    acciones: [recalcular (tools/sync_finca.py)]
  - nombre: "Fuente"
    tabla_db: null
    propiedades: [titulo, organizacion, url, archivo_raw, fecha_descarga]
    acciones: [ingest]
link_types:
